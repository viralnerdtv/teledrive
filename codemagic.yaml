
workflows:
  teledrive-ios:
    name: TeleDrive - iOS IPA
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      xcode: latest
      node: 22

    scripts:      
      - name: Install Rust
        script: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          source "$HOME/.cargo/env"
          rustup default stable
          rustup target add aarch64-apple-ios


      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Install Node dependencies
        script: |
          npm ci

      - name: Initialize iOS project
        
      - name: Initialize iOS project
        script: |
          export PATH="$HOME/.cargo/bin:$PATH"
          rustc --version
          cargo --version
          cargo metadata --no-deps --format-version 1
          npx tauri ios init --ci --skip-targets-install


      - name: Generate Xcode project
        script: |
          xcodegen generate --spec src-tauri/gen/apple/project.yml

      - name: Build TeleDrive for iPhone
        script: |
          npm run tauri ios build -- --target aarch64 --debug --ci -- CODE_SIGNING_ALLOWED=NO

    artifacts:
      - src-tauri/gen/apple/build/arm64/*.ipa
      - src-tauri/gen/apple/build/arm64/**/*.app
      - /tmp/xcodebuild_logs/*.log
