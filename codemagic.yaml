
workflows:
  teledrive-ios:
    name: TeleDrive - iOS IPA
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      xcode: latest
      node: 22

    scripts:
      - name: Install Rust
        script: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup default stable
          rustup target add aarch64-apple-ios

      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Install Node dependencies
        script: |
          npm ci

      - name: Initialize iOS project
        script: |
          export PATH="$HOME/.cargo/bin:$PATH"
          rustc --version
          cargo --version
          cargo metadata --no-deps --format-version 1
          npx tauri ios init --ci --skip-targets-install

      - name: Generate Xcode project
        script: |
          export PATH="$HOME/.cargo/bin:$PATH"
          xcodegen generate --spec src-tauri/gen/apple/project.yml

      
      - name: Build TeleDrive for iPhone
        script: |
          export PATH="$HOME/.cargo/bin:$PATH"
          npm run tauri ios build -- --target aarch64 --debug --ci --no-sign --archive-only

      - name: Package unsigned IPA
        script: |
          set -e

          ARCHIVE=$(find src-tauri/gen/apple -type d -name "*.xcarchive" -print -quit)

          if [ -z "$ARCHIVE" ]; then
            echo "Arquivo XCARCHIVE não encontrado"
            exit 1
          fi

          APP=$(find "$ARCHIVE/Products/Applications" -maxdepth 1 -type d -name "*.app" -print -quit)

          if [ -z "$APP" ]; then
            echo "Aplicativo .app não encontrado"
            exit 1
          fi

          mkdir -p "$CM_BUILD_DIR/ipa/Payload"
          ditto "$APP" "$CM_BUILD_DIR/ipa/Payload/$(basename "$APP")"

          cd "$CM_BUILD_DIR/ipa"
          ditto -c -k --sequesterRsrc --keepParent Payload "$CM_BUILD_DIR/TeleDrive-unsigned.ipa"



        artifacts:
      - TeleDrive-unsigned.ipa
      - src-tauri/gen/apple/build/arm64/*.ipa
      - src-tauri/gen/apple/build/arm64/**/*.app
      - /tmp/xcodebuild_logs/*.log
